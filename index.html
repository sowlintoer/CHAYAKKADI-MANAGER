<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaayakkadi Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Modern Color Palette */
            --primary: #4f46e5;       
            --primary-hover: #4338ca; 
            --success: #10b981;       
            --success-hover: #059669; 
            --danger: #ef4444;        
            --danger-hover: #dc2626;  
            
            --bg-color: #f8fafc;      
            --card-bg: #ffffff;
            --text-main: #0f172a;     
            --text-muted: #64748b;    
            --border: #e2e8f0;        
            
            /* Spacing & Radii */
            --radius-lg: 1rem;
            --radius-md: 0.75rem;
            --radius-sm: 0.5rem;
            
            /* Shadows */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-focus: 0 0 0 3px rgba(79, 70, 229, 0.2);
            
            --transition: all 0.2s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Sticky Wrapper for Header & Tabs */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--bg-color);
            padding-bottom: 15px; /* Creates spacing before content slides under */
        }

        header {
            background-color: var(--card-bg);
            color: var(--text-main);
            text-align: center;
            padding: 1.5rem 1rem;
            font-size: 1.5rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Navigation Tabs */
        .tabs-container {
            max-width: 800px;
            margin: 20px auto 0;
            padding: 0 15px;
        }
        
        .tabs {
            display: flex;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 6px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            overflow-x: auto;
            gap: 5px;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            flex: 1;
            padding: 10px 16px;
            text-align: center;
            background: transparent;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
            white-space: nowrap;
            transition: var(--transition);
        }

        .tab-btn:hover {
            color: var(--text-main);
            background: var(--bg-color);
        }

        .tab-btn.active {
            color: var(--primary);
            background: rgba(79, 70, 229, 0.1);
        }

        /* Main Container & Sheets */
        .container {
            max-width: 800px;
            margin: 10px auto 20px;
            padding: 0 15px;
        }

        .sheet {
            display: none;
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            margin-bottom: 40px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sheet.active {
            display: block;
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: var(--text-main);
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        
        h3 {
            font-size: 1.1rem;
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: var(--bg-color);
            transition: var(--transition);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--card-bg);
            box-shadow: var(--shadow-focus);
        }

        /* Buttons */
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: var(--success-hover); }
        
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: var(--danger-hover); }
        
        .btn-small { 
            padding: 6px 12px; 
            font-size: 0.85rem; 
            border-radius: var(--radius-sm);
        }

        /* Setup Grid (Side by side checkboxes) */
        .attendance-wrapper {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            
            /* Grid layout for side-by-side display */
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }

        .member-list-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .member-list-item:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .member-list-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            accent-color: var(--primary);
            cursor: pointer;
        }
        
        .member-list-item label {
            margin: 0;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
        }

        .count-widget {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(79,70,229,0.1), rgba(79,70,229,0.05));
            border: 1px solid rgba(79,70,229,0.2);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin: 20px 0;
        }

        .large-count { font-size: 4rem; color: var(--primary); font-weight: 700; line-height: 1; }
        .count-label { color: var(--text-muted); font-weight: 500; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem; }

        /* Settings Collapsible Sections */
        details.settings-section {
            background: var(--bg-color);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        details.settings-section summary {
            padding: 16px 20px;
            cursor: pointer;
            list-style: none; /* Removes default arrow in standard browsers */
            user-select: none;
        }
        
        /* Remove default arrow in Safari */
        details.settings-section summary::-webkit-details-marker { display: none; }

        .arrow-icon {
            transition: transform 0.3s ease;
            color: var(--text-muted);
        }

        details[open].settings-section summary .arrow-icon {
            transform: rotate(180deg);
        }
        
        details[open].settings-section summary {
            border-bottom: 1px solid var(--border);
        }

        .settings-content {
            padding: 20px;
        }

        .list-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            box-shadow: var(--shadow-sm);
        }
        
        .list-row b { color: var(--text-main); font-weight: 600; }
        .list-row small { color: var(--text-muted); }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 16px;
        }

        /* Tables */
        .table-responsive { overflow-x: auto; background: var(--card-bg); border-radius: var(--radius-md); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background-color: var(--bg-color); font-weight: 600; color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background-color: var(--bg-color); }

        .summary-box {
            background: var(--bg-color);
            padding: 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .top-summary { margin-top: 0; margin-bottom: 24px; justify-content: center; }

        .summary-total { font-size: 1.5rem; font-weight: 700; color: var(--success); }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .input-group { grid-template-columns: 1fr; }
            .summary-box { flex-direction: column; gap: 15px; text-align: center; }
            .attendance-wrapper { grid-template-columns: 1fr 1fr; } 
        }
    </style>
</head>
<body>

    <!-- Sticky Header Wrapper -->
    <div class="sticky-header">
        <header>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary)"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path><line x1="6" y1="2" x2="6" y2="4"></line><line x1="10" y1="2" x2="10" y2="4"></line><line x1="14" y1="2" x2="14" y2="4"></line></svg>
            Chaayakkadi Manager
        </header>

        <div class="tabs-container">
            <div class="tabs">
                <button class="tab-btn active" onclick="openTab('sheet1')">Setup</button>
                <button class="tab-btn" onclick="openTab('sheet2')">Food</button>
                <button class="tab-btn" onclick="openTab('sheet3')">Settings</button>
                <button class="tab-btn" onclick="openTab('sheet4')">History</button>
            </div>
        </div>
    </div>

    <div class="container">
        
        <!-- SHEET 1: Setup -->
        <div id="sheet1" class="sheet active">
            <h2>Treat Details</h2>
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="event-date">
            </div>
            <div class="form-group">
                <label>Treat By (Host)</label>
                <select id="event-host"></select>
            </div>
            <div class="form-group">
                <label>Type of Treat</label>
                <select id="event-type"></select>
            </div>

            <div class="count-widget">
                <div class="large-count" id="selected-count">0</div>
                <div class="count-label">Members Present</div>
            </div>

            <h3 style="margin-bottom: 12px;">Select Present Members</h3>
            <div class="attendance-wrapper" id="attendance-list">
                <!-- Checkboxes injected here in Grid layout -->
            </div>

            <button onclick="goToSheet2()" style="width: 100%; margin-top: 24px; padding: 14px;">
                Proceed to Food Selection
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </div>

        <!-- SHEET 2: Food Selection -->
        <div id="sheet2" class="sheet">
            <h2>Select Food</h2>
            
            <!-- Top Summary Count -->
            <div class="summary-box top-summary">
                <div style="color: var(--text-main); font-weight: 600; font-size: 1.1rem;">
                    Total Members: <span id="s2-pax-count" style="color: var(--primary); font-size: 1.4rem;">0</span>
                </div>
            </div>

            <div class="form-group">
                <label>Selection Mode</label>
                <select id="food-mode" onchange="toggleFoodMode()">
                    <option value="same">Same for all</option>
                    <option value="separate">Separate (Choose individually)</option>
                </select>
            </div>

            <!-- Shown if "Same for all" -->
            <div id="food-same-section" style="display: block;">
                <div class="form-group" style="background: var(--bg-color); padding: 15px; border-radius: var(--radius-sm); border: 1px solid var(--border);">
                    <label style="color: var(--primary); font-weight: 600;">Select Food for Everyone</label>
                    <select id="food-for-all" onchange="updateEstimatedTotal()"></select>
                </div>
            </div>

            <!-- Shown if "Separate" -->
            <div id="food-selection-list" style="display: none;">
                <!-- Dropdowns injected here -->
            </div>
            
            <div class="summary-box">
                <div>
                    <div style="color: var(--text-muted); font-size: 0.9rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;">Estimated Total</div>
                    <div class="summary-total">₹<span id="estimated-total">0</span></div>
                </div>
                <button class="btn-success" onclick="saveEvent()" style="padding: 14px 24px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    Save Event
                </button>
            </div>
        </div>

        <!-- SHEET 3: Settings -->
        <div id="sheet3" class="sheet">
            <h2>Master Settings</h2>

            <!-- Members Collapsible -->
            <details class="settings-section" open>
                <summary>
                    <h3>Members <span class="arrow-icon">▼</span></h3>
                </summary>
                <div class="settings-content">
                    <div class="input-group">
                        <input type="text" id="new-member-name" placeholder="Member Name">
                        <input type="date" id="new-member-dob" title="Birthday">
                        <button onclick="addMember()">Add</button>
                    </div>
                    <div id="settings-members-list"></div>
                </div>
            </details>

            <!-- Food Items Collapsible -->
            <details class="settings-section">
                <summary>
                    <h3>Food Items <span class="arrow-icon">▼</span></h3>
                </summary>
                <div class="settings-content">
                    <div class="input-group">
                        <input type="text" id="new-food-name" placeholder="Food Item">
                        <input type="number" id="new-food-rate" placeholder="Rate (₹)">
                        <button onclick="addFood()">Add</button>
                    </div>
                    <div id="settings-food-list"></div>
                </div>
            </details>

            <!-- Treat Types Collapsible -->
            <details class="settings-section">
                <summary>
                    <h3>Treat Types <span class="arrow-icon">▼</span></h3>
                </summary>
                <div class="settings-content">
                    <div class="input-group" style="grid-template-columns: 1fr auto;">
                        <input type="text" id="new-treat-type" placeholder="Treat Type">
                        <button onclick="addTreatType()">Add</button>
                    </div>
                    <div id="settings-treat-list"></div>
                </div>
            </details>
        </div>

        <!-- SHEET 4: History -->
        <div id="sheet4" class="sheet">
            <h2>Event History</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Host</th>
                            <th>Treat Type</th>
                            <th>Pax</th>
                            <th>Amount (₹)</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body">
                        <!-- History injected here -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // --- Data Initialization with new employees ---
        const initialMembers = [
            { id: 1, name: "Nishanth", dob: "1977-05-02" },
            { id: 2, name: "Anees", dob: "1992-09-06" },
            { id: 3, name: "Thanseer", dob: "1995-10-29" },
            { id: 4, name: "Shabeer", dob: "1996-04-27" },
            { id: 5, name: "Giljith", dob: "1979-05-24" },
            { id: 6, name: "Fahid", dob: "1994-12-24" },
            { id: 7, name: "Shifin", dob: "1999-10-16" },
            { id: 8, name: "Akash", dob: "1996-03-14" },
            { id: 9, name: "Fasal", dob: "1993-05-02" },
            { id: 10, name: "Arshad", dob: "1995-04-23" },
            { id: 11, name: "Bineesh", dob: "1987-05-01" },
            { id: 12, name: "Subin", dob: "1997-10-29" },
            { id: 13, name: "Delvin", dob: "2001-06-30" },
            { id: 14, name: "Fawas", dob: "1995-01-12" },
            { id: 15, name: "Fayas", dob: "1994-04-12" },
            { id: 16, name: "Chithra", dob: "1990-08-03" },
            { id: 17, name: "Sehil", dob: "1996-02-02" }
        ];

        let members = JSON.parse(localStorage.getItem('chaaya_members'));
        // Load initial members if localStorage is empty or contains the old list of 26 
        if (!members || members.length === 0 || members.length === 26) {
            members = initialMembers;
            localStorage.setItem('chaaya_members', JSON.stringify(members));
        }

        let foodItems = JSON.parse(localStorage.getItem('chaaya_foods')) || [];
        let treatTypes = JSON.parse(localStorage.getItem('chaaya_treats')) || [
            "Birthday", "Become Parent", "First Salary", "Monthly Chitty Winner", "Buy a Vehicle"
        ];
        let events = JSON.parse(localStorage.getItem('chaaya_events')) || [];

        // Temporary state for the active event creation
        let currentSelectedMembers = [];

        // Helper: Format Date to dd/mm/yyyy exactly
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                // Ensure format maps from yyyy-mm-dd string to dd/mm/yyyy
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return dateStr;
        }
        
        // Helper: For main history view dd-mmm-yyyy
        function formatHistoryDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            return `${d.getDate().toString().padStart(2, '0')}-${months[d.getMonth()]}-${d.getFullYear()}`;
        }

        // --- UI Navigation ---
        function openTab(tabId) {
            document.querySelectorAll('.sheet').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');

            if (tabId === 'sheet1') loadSheet1();
            if (tabId === 'sheet3') loadSheet3();
            if (tabId === 'sheet4') loadSheet4();
            
            // Scroll back to top whenever a new tab opens to compensate for sticky header
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- Sheet 1 Logic ---
        function loadSheet1() {
            document.getElementById('event-date').valueAsDate = new Date();
            
            const hostSelect = document.getElementById('event-host');
            hostSelect.innerHTML = members.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
            
            const typeSelect = document.getElementById('event-type');
            typeSelect.innerHTML = treatTypes.map(t => `<option value="${t}">${t}</option>`).join('');

            const listContainer = document.getElementById('attendance-list');
            listContainer.innerHTML = members.map(m => `
                <div class="member-list-item">
                    <input type="checkbox" id="chk-${m.id}" value="${m.id}" onchange="updateCount()">
                    <label for="chk-${m.id}">${m.name}</label>
                </div>
            `).join('');
            updateCount();
        }

        function updateCount() {
            const checked = document.querySelectorAll('#attendance-list input:checked').length;
            document.getElementById('selected-count').innerText = checked;
        }

        function goToSheet2() {
            const checkedBoxes = document.querySelectorAll('#attendance-list input:checked');
            if (checkedBoxes.length === 0) {
                alert("Please select at least one member to proceed.");
                return;
            }
            
            currentSelectedMembers = Array.from(checkedBoxes).map(cb => {
                const member = members.find(m => m.id == cb.value);
                return { id: member.id, name: member.name };
            });

            loadSheet2();
            
            // Switch tabs visually
            document.querySelectorAll('.tab-btn')[1].click();
        }

        // --- Sheet 2 Logic ---
        function loadSheet2() {
            // Update Top Count
            document.getElementById('s2-pax-count').innerText = currentSelectedMembers.length;
            
            const foodOptions = `<option value="">-- Select Food --</option>` + 
                foodItems.map(f => `<option value="${f.id}" data-rate="${f.rate}">${f.name} (₹${f.rate})</option>`).join('');

            // Setup "Same for all" dropdown
            document.getElementById('food-for-all').innerHTML = foodOptions;

            // Setup "Separate" dropdowns
            const container = document.getElementById('food-selection-list');
            container.innerHTML = currentSelectedMembers.map(m => `
                <div class="form-group" style="background: var(--bg-color); padding: 15px; border-radius: var(--radius-sm); border: 1px solid var(--border);">
                    <label style="color: var(--primary); font-weight: 600; font-size: 1rem;">${m.name}</label>
                    <select id="food-for-${m.id}" onchange="updateEstimatedTotal()" style="margin-top: 8px;">
                        ${foodOptions}
                    </select>
                </div>
            `).join('');
            
            toggleFoodMode(); // Initialize layout based on dropdown
        }

        function toggleFoodMode() {
            const mode = document.getElementById('food-mode').value;
            if (mode === 'same') {
                document.getElementById('food-same-section').style.display = 'block';
                document.getElementById('food-selection-list').style.display = 'none';
            } else {
                document.getElementById('food-same-section').style.display = 'none';
                document.getElementById('food-selection-list').style.display = 'block';
            }
            updateEstimatedTotal();
        }

        function updateEstimatedTotal() {
            let total = 0;
            const mode = document.getElementById('food-mode').value;

            if (mode === 'same') {
                const select = document.getElementById('food-for-all');
                if (select.value) {
                    const rate = parseFloat(select.options[select.selectedIndex].getAttribute('data-rate'));
                    total = rate * currentSelectedMembers.length;
                }
            } else {
                currentSelectedMembers.forEach(m => {
                    const select = document.getElementById(`food-for-${m.id}`);
                    if (select && select.value !== "") {
                        total += parseFloat(select.options[select.selectedIndex].getAttribute('data-rate'));
                    }
                });
            }
            document.getElementById('estimated-total').innerText = total;
        }

        function saveEvent() {
            const date = document.getElementById('event-date').value;
            const hostId = document.getElementById('event-host').value;
            const treatType = document.getElementById('event-type').value;

            if(!date || !hostId || !treatType) {
                alert("Please complete event details on Setup page.");
                return;
            }

            const mode = document.getElementById('food-mode').value;
            let totalAmount = 0;
            const finalParticipants = [];

            if (mode === 'same') {
                const select = document.getElementById('food-for-all');
                if (!select.value) {
                    alert("Please select a food item for everyone.");
                    return;
                }
                const selectedOption = select.options[select.selectedIndex];
                const rate = parseFloat(selectedOption.getAttribute('data-rate'));
                
                for (let m of currentSelectedMembers) {
                    finalParticipants.push({
                        memberId: m.id,
                        memberName: m.name,
                        foodId: select.value,
                        foodName: selectedOption.text.split(' (₹')[0], 
                        rate: rate
                    });
                    totalAmount += rate;
                }
            } else {
                for (let m of currentSelectedMembers) {
                    const select = document.getElementById(`food-for-${m.id}`);
                    if (!select.value) {
                        alert(`Please select a food item for ${m.name}`);
                        return;
                    }
                    const selectedOption = select.options[select.selectedIndex];
                    const rate = parseFloat(selectedOption.getAttribute('data-rate'));
                    
                    finalParticipants.push({
                        memberId: m.id,
                        memberName: m.name,
                        foodId: select.value,
                        foodName: selectedOption.text.split(' (₹')[0],
                        rate: rate
                    });
                    totalAmount += rate;
                }
            }

            const newEvent = {
                id: Date.now(),
                date: date,
                hostId: hostId,
                hostName: members.find(m => m.id == hostId)?.name || 'Unknown',
                treatType: treatType,
                participants: finalParticipants,
                totalAmount: totalAmount,
                totalParticipants: finalParticipants.length
            };

            events.unshift(newEvent); // Add to beginning
            localStorage.setItem('chaaya_events', JSON.stringify(events));
            
            alert("Event Saved Successfully!");
            
            currentSelectedMembers = [];
            document.querySelectorAll('.tab-btn')[3].click();
        }

        // --- Sheet 3 Logic (Settings) ---
        function loadSheet3() {
            // Render Members
            document.getElementById('settings-members-list').innerHTML = members.map(m => `
                <div class="list-row" id="member-row-${m.id}">
                    <div><b>${m.name}</b> <br><small>DOB: ${formatDate(m.dob) || 'Not Added'}</small></div>
                    <div style="display:flex; gap: 5px;">
                        <button class="btn-small btn-success" onclick="editMember(${m.id})">Edit</button>
                        <button class="btn-small btn-danger" onclick="deleteMember(${m.id})">Del</button>
                    </div>
                </div>
            `).join('') || '<div class="list-row" style="justify-content:center; color:var(--text-muted);">No members added.</div>';

            // Render Food
            document.getElementById('settings-food-list').innerHTML = foodItems.map(f => `
                <div class="list-row">
                    <div><b>${f.name}</b> <br><small>Rate: ₹${f.rate}</small></div>
                    <button class="btn-small btn-danger" onclick="deleteFood(${f.id})">Delete</button>
                </div>
            `).join('') || '<div class="list-row" style="justify-content:center; color:var(--text-muted);">No food items added.</div>';

            // Render Treat Types
            document.getElementById('settings-treat-list').innerHTML = treatTypes.map((t, index) => `
                <div class="list-row">
                    <div><b>${t}</b></div>
                    <button class="btn-small btn-danger" onclick="deleteTreatType(${index})">Delete</button>
                </div>
            `).join('');
        }

        // Inline Edit Logic
        function editMember(id) {
            const member = members.find(m => m.id === id);
            const row = document.getElementById(`member-row-${id}`);
            row.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:5px; flex:1; margin-right:10px;">
                    <input type="text" id="edit-name-${id}" value="${member.name}" style="padding: 6px; font-size:0.9rem;" placeholder="Name">
                    <input type="date" id="edit-dob-${id}" value="${member.dob || ''}" style="padding: 6px; font-size:0.9rem;">
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <button class="btn-small btn-success" onclick="saveEditMember(${id})">Save</button>
                    <button class="btn-small" onclick="loadSheet3()" style="background:#64748b;">Cancel</button>
                </div>
            `;
        }

        function saveEditMember(id) {
            const member = members.find(m => m.id === id);
            member.name = document.getElementById(`edit-name-${id}`).value;
            member.dob = document.getElementById(`edit-dob-${id}`).value;
            localStorage.setItem('chaaya_members', JSON.stringify(members));
            loadSheet3();
        }

        function addMember() {
            const name = document.getElementById('new-member-name').value;
            const dob = document.getElementById('new-member-dob').value;
            if(!name) return;
            members.push({ id: Date.now(), name, dob });
            localStorage.setItem('chaaya_members', JSON.stringify(members));
            document.getElementById('new-member-name').value = '';
            document.getElementById('new-member-dob').value = '';
            loadSheet3();
        }
        function deleteMember(id) {
            if(confirm("Delete this member?")) {
                members = members.filter(m => m.id !== id);
                localStorage.setItem('chaaya_members', JSON.stringify(members));
                loadSheet3();
            }
        }

        function addFood() {
            const name = document.getElementById('new-food-name').value;
            const rate = parseFloat(document.getElementById('new-food-rate').value);
            if(!name || isNaN(rate)) return;
            foodItems.push({ id: Date.now(), name, rate });
            localStorage.setItem('chaaya_foods', JSON.stringify(foodItems));
            document.getElementById('new-food-name').value = '';
            document.getElementById('new-food-rate').value = '';
            loadSheet3();
        }
        function deleteFood(id) {
            if(confirm("Delete this food item?")) {
                foodItems = foodItems.filter(f => f.id !== id);
                localStorage.setItem('chaaya_foods', JSON.stringify(foodItems));
                loadSheet3();
            }
        }

        function addTreatType() {
            const type = document.getElementById('new-treat-type').value;
            if(!type) return;
            treatTypes.push(type);
            localStorage.setItem('chaaya_treats', JSON.stringify(treatTypes));
            document.getElementById('new-treat-type').value = '';
            loadSheet3();
        }
        function deleteTreatType(index) {
            if(confirm("Delete this treat type?")) {
                treatTypes.splice(index, 1);
                localStorage.setItem('chaaya_treats', JSON.stringify(treatTypes));
                loadSheet3();
            }
        }

        // --- Sheet 4 Logic (History) ---
        function loadSheet4() {
            const tbody = document.getElementById('history-table-body');
            tbody.innerHTML = events.map(e => `
                <tr>
                    <td>${formatHistoryDate(e.date)}</td>
                    <td style="font-weight: 500; color: var(--text-main);">${e.hostName}</td>
                    <td><span style="background: var(--bg-color); padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; border: 1px solid var(--border);">${e.treatType}</span></td>
                    <td>${e.totalParticipants}</td>
                    <td style="color: var(--success); font-weight: 700;">₹${e.totalAmount}</td>
                </tr>
            `).join('');
            
            if (events.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 30px; color: var(--text-muted);">No events saved yet.</td></tr>`;
            }
        }

        // Initial Load
        loadSheet1();
    </script>
</body>
</html>
